<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖繩夏日冒險．5日自駕遊</title>
    <style>
        :root {
            --primary: #1e3a8a; 
            --accent: #0ea5e9;  
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --link-btn: #f97316; 
            --map-link: #2563eb;
            --food-tag: #ef4444; /* 新增美食標籤顏色 */
        }

        body {
            font-family: 'Segoe UI', 'Roboto', "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: #1e293b;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        .main-container {
            max-width: 800px;
            margin: -30px auto 30px;
            padding: 0 20px;
        }

        .day-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-left: 8px solid var(--primary);
        }

        .day-title {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .day-title span {
            background: var(--primary);
            color: white;
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 0.9rem;
            margin-right: 12px;
        }

        .item {
            margin-bottom: 18px;
            line-height: 1.7;
        }

        .map-link {
            font-weight: 600;
            color: var(--map-link);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        
        .map-link:hover {
            text-decoration: underline;
        }

        .map-link::after {
            content: ' 📍';
            font-size: 0.8em;
        }

        /* 食物特別標示 */
        .food-item::before {
            content: '🍴 ';
        }

        .item-desc {
            color: #64748b;
            font-size: 0.95rem;
            display: block;
        }

        .booking-btn {
            display: inline-flex;
            align-items: center;
            background-color: var(--link-btn);
            color: white;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .hotel-box {
            background-color: #fff7ed;
            border: 1px dashed #fdba74;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .photo-container {
            max-width: 800px;
            margin: 0 auto 50px;
            padding: 0 20px;
            text-align: center;
        }

        .my-photo {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 8px solid white;
            box-sizing: border-box;
        }

        .photo-caption {
            margin-top: 15px;
            color: #64748b;
            font-style: italic;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>OKINAWA TRIP</h1>
    <p>2026 沖繩．海底秘境與自駕之行</p>
</header>

            <span class="item-desc">宵夜：沖繩民謠與在地料理 (營業至 00:00)</span>
